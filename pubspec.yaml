name: kassasysteem
description: Kassasysteem met EAN-scanner, PLU-import en bonprinter.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^8.1.2
  http: ^1.2.2
  image: ^4.2.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  printing: ^5.13.4
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/products_default.json
    - assets/sounds/
