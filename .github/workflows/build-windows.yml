name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Windows platform files
        run: flutter create --platforms=windows --org nl.kassa .

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build
        run: flutter build windows --release

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Kassa-Windows
          path: build/windows/x64/runner/Release/
